# Annuaire des 19 communes du Grand Nancy hors Nancy (Nancy : Agenda Grand Nancy).
# Établi le 02/11/2026 : sites trouvés par recherche web puis vérifiés par requête, flux RSS
# cherchés dans le HTML de l'accueil (<link rel="alternate">) puis par /feed/ et variantes,
# mentions légales lues pour les communes à flux actif.
#
# Champs
#   nom             nom officiel (clé de Veille::GrandNancy)
#   site            site officiel
#   rss             URL exacte du flux, nil si aucun
#   flux_actif      vrai si le flux contient des articles récents (< 2 mois au 02/11/2026)
#   derniere_publication  date du dernier article du flux (ISO)
#   mentions_legales  page des mentions légales, nil si introuvable
#   reutilisation   ce que disent les mentions légales pour notre usage (titre + extrait + lien
#                   dans la file de relecture, réécriture par nos soins) :
#                     autorisee      reproduction électronique permise avec la source
#                     non_precisee   aucune mention trouvée
#                     restreinte     interdiction explicite ou usage limité aux échanges avec la commune
#                     non_lue        non examinée (pas de flux à lire)
#   reutilisation_note  citation ou résumé de la clause
#   facebook, instagram  pages repérées sur le site communal (liens seulement : aucun appel automatisé)
#   remarque        tout ce qui explique le classement
#
# Le connecteur Veille::Connectors::Communes ne lit que les communes dont `flux_actif` est vrai
# et dont `reutilisation` n'est pas `restreinte`. Toutes les autres vont sur /admin/veille/communes.
---
communes:
  - nom: Art-sur-Meurthe
    site: https://artsurmeurthe.fr
    rss: https://artsurmeurthe.fr/feed/
    flux_actif: true
    derniere_publication: 2026-10-06
    mentions_legales: https://artsurmeurthe.fr/mentions-legales/
    reutilisation: restreinte
    reutilisation_note: "Toute reproduction, représentation, modification, publication, adaptation totale ou partielle des éléments du site (…) est interdite, sauf autorisation écrite préalable."
    facebook: https://www.facebook.com/Art.sur.Meurthe/
    instagram: https://www.instagram.com/art_sur_meurthe/
    remarque: Ancien domaine mairie-art-sur-meurthe.fr redirige vers artsurmeurthe.fr. robots.txt avec Crawl-delay 10. Exclue du connecteur (mentions légales).

